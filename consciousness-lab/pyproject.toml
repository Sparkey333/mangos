[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conlab"
version = "0.1.0"
description = "Consciousness Lab: declassified-document + biometric research toolkit (local-first)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Consciousness Lab" }]
dependencies = []  # core runs on the standard library only

[project.optional-dependencies]
# Real Muse headband over BLE (works on Raspberry Pi too).
hardware = ["brainflow>=5.10"]
# Optional richer scraping if you later automate document discovery.
scrape = ["requests>=2.31", "beautifulsoup4>=4.12"]
dev = ["pytest>=7"]

[project.scripts]
conlab = "conlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
