<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Bit Claude's Ocean Dive 🌊</title>
<style>
  :root { --sea:#0a2942; --sea2:#12476e; }
  * { box-sizing:border-box; }
  html,body {
    margin:0; height:100%;
    background:radial-gradient(120% 120% at 50% 0%, #1b6ea0 0%, var(--sea2) 45%, var(--sea) 100%);
    font-family:"Courier New",monospace; color:#dff6ff; overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:10px;
  }
  h1 { margin:0; font-size:clamp(18px,4vw,28px); letter-spacing:1px;
       text-shadow:0 2px 0 #04304a; }
  #stage {
    position:relative; width:min(96vw, 88vh*16/9);
    aspect-ratio:16/9; max-height:88vh;
    border:3px solid #0a4d5e; border-radius:8px;
    box-shadow:0 0 0 3px #062633, 0 12px 40px rgba(0,0,0,.5);
    background:#0a3550; overflow:hidden;
  }
  canvas {
    width:100%; height:100%; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  .hint { font-size:clamp(11px,2.4vw,14px); opacity:.85; text-align:center; }
  .tag { color:#5fe0e0; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🌊 Bit Claude's Ocean Dive 🐠</h1>
  <div id="stage"><canvas id="c" width="320" height="180"></canvas></div>
  <div class="hint">
    <span class="tag">Move:</span> Arrows / WASD / drag &nbsp;·&nbsp;
    <span class="tag">Collect</span> fish, starfish &amp; shells &nbsp;·&nbsp;
    <span class="tag">Dodge</span> jellyfish, pufferfish, crabs &amp; squid
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Bit Claude's Ocean Dive — a tiny 8-bit underwater dodger.
   Everything (Claude + sea creatures) is hand-drawn pixel art
   rendered on a 320x180 canvas for matching low-res charm.
   ============================================================ */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height;

/* ---------- pixel-art sprite system ----------
   Each sprite is an array of equal-ish rows of chars.
   '.' = transparent. Other chars map to colors via a palette.
   Rows are normalized so ragged art can't break rendering. */
function makeSprite(rows, palette) {
  const w = Math.max(...rows.map(r => r.length));
  const norm = rows.map(r => r.padEnd(w, "."));
  return { rows: norm, palette, w, h: norm.length };
}
function drawSprite(spr, dx, dy, scale, flip) {
  const { rows, palette, w, h } = spr;
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      const col = palette[ch];
      if (!col) continue;
      const px = flip ? (w - 1 - x) : x;
      ctx.fillStyle = col;
      ctx.fillRect(dx + px * scale, dy + y * scale, scale, scale);
    }
  }
}

/* ---------- Bit Claude (recolored AQUA scuba diver) ----------
   The classic Claude blob, retinted from terracotta to ocean aqua,
   wearing a little dive mask. */
const claudePal = {
  o:"#063a44", // dark outline
  b:"#33c9c9", // body aqua
  l:"#8af1ec", // highlight
  g:"#0d6a7a", // mask frame
  s:"#bdfcff", // mask glass / shine
  w:"#ffffff", // eye white
  k:"#06343c", // pupil
  m:"#0a4a52"  // smile
};
const claude = makeSprite([
  "....oooooo....",
  "..oobbbbbboo..",
  ".obblbbbbbbo.",
  "obbbbbbbbbblo",
  "obggggggggggo",
  "obgswwgswwsgo",
  "obgswkgswks go",
  "obgsswgsswsgo",
  "obggggggggggo",
  "obbbbbbbbbbbo",
  "obbbbmmmmbbbo",
  ".obbbmmmmbbo.",
  "..obbbbbbbo..",
  "...oobbboo...",
  ".....oo o....",
], claudePal);

/* ---------- Sea creatures (collectibles, +points) ---------- */
const clownfish = makeSprite([
  "....oooo....",
  "..oobbbboo..",
  ".obwwbbwwbo.",
  "obbwwbbwwbbo",
  "obooobbooobo",
  "obbwwbbwwbbo",
  ".obbbbbbbbo.o",
  "..ooobbbooooo",
  "....oooo..oo.",
], {o:"#7a2a00", b:"#ff8c1a", w:"#fff4e0"});

const starfish = makeSprite([
  ".....oo.....",
  ".....ll.....",
  "....olllo...",
  "o...olllo..o",
  "oo.ollllo.oo",
  ".ooollllooo.",
  "..ollllllo..",
  ".olllooollo.",
  "ollo o oollo",
  "oo........oo",
], {o:"#b07000", l:"#ffd23f"});

const shell = makeSprite([
  "....oooo....",
  "..oopppppoo.",
  ".oprprprprpo",
  "oprpwprpwprpo",
  "oprprprprprpo",
  ".oprprprprpo.",
  "..oppppppoo.",
  "...oooooo...",
], {o:"#7a2350", p:"#ff8fc4", r:"#ffc2dd", w:"#fff0f7"});

/* ---------- Hazards (avoid, costs a life) ---------- */
const jellyfish = makeSprite([
  "...oooooo...",
  "..opppppppo.",
  ".opllllllpo.",
  "opllssllllpo",
  "oppppppppppo",
  ".o.p.p.p.p.o",
  "..g.g.g.g.g.",
  ".g..g.g..g.g",
  "g...g..g...g",
  "....g...g...",
], {o:"#3a0a55", p:"#b14de0", l:"#e3a7ff", s:"#fff0ff", g:"#8a3acb"});

const puffer = makeSprite([
  "..k..oo..k..",
  "k.kooooook.k",
  ".kogggggok.",
  "kogggwggggok",
  "oggwkggggggo",
  "oggggggwkggo",
  "kogggggwggok",
  ".kogggggok.",
  "k.kooooook.k",
  "..k..oo..k..",
], {o:"#1d5a1d", g:"#5fcb4a", w:"#eafff0", k:"#103a10"});

const crab = makeSprite([
  "o..o....o..o",
  "oo.oo..oo.oo",
  ".oo.oooo.oo.",
  "...orrrro...",
  "..orwrrwro..",
  ".orrrrrrrro.",
  "..orrrrrro..",
  "..o.oo.oo.o.",
  ".o..o..o..o.",
], {o:"#7a0f0f", r:"#f0463c", w:"#ffe2df"});

const squid = makeSprite([
  "...oooo...",
  "..ommmmo..",
  ".ommwwmmo.",
  ".ommkkmmo.",
  ".ommmmmmo.",
  "..ommmmo..",
  ".o.o.o.o.o",
  "o.o.o.o.o.",
  ".o..o.o..o",
  "o..o...o..",
], {o:"#5a0a45", m:"#e64bb0", w:"#fff0fa", k:"#3a0530"});

/* ---------- decorative background bits ---------- */
const seaweed = makeSprite([
  ".g.",".gg","gg.",".gg",".g.","gg.",".gg",".g.","gg.",".g.","ggg"
], {g:"#0e7a52"});

/* ============================================================
   Creature catalog
   ============================================================ */
const GOOD = [
  { spr: clownfish, score: 10 },
  { spr: starfish,  score: 15 },
  { spr: shell,     score: 20 },
];
const BAD = [
  { spr: jellyfish }, { spr: puffer }, { spr: crab }, { spr: squid },
];

/* ============================================================
   Game state
   ============================================================ */
const SCALE = 2;                 // sprite pixel scale on the 320x180 canvas
const player = {
  x: 40, y: H/2, w: claude.w*SCALE, h: claude.h*SCALE,
  vx:0, vy:0, flip:false, bobT:0, hurt:0
};
let entities = [];   // active creatures
let bubbles = [];    // ambient bubbles
let weeds = [];      // background seaweed
let score = 0, lives = 3, best = +(localStorage.getItem("bitClaudeOceanBest")||0);
let spawnT = 0, speed = 60, elapsed = 0;
let state = "title"; // title | play | over
let shake = 0;

/* ---------- input ---------- */
const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if ([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
  if (state !== "play" && (e.key===" "||e.key==="Enter")) startGame();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// pointer / touch drag
let drag = null;
function toCanvas(ev){
  const r = cv.getBoundingClientRect();
  const p = ev.touches ? ev.touches[0] : ev;
  return { x:(p.clientX-r.left)/r.width*W, y:(p.clientY-r.top)/r.height*H };
}
function pointerDown(ev){ if(state!=="play"){ startGame(); } drag = toCanvas(ev); ev.preventDefault(); }
function pointerMove(ev){ if(drag) drag = toCanvas(ev); ev.preventDefault(); }
function pointerUp(){ drag = null; }
cv.addEventListener("mousedown", pointerDown);
cv.addEventListener("mousemove", pointerMove);
addEventListener("mouseup", pointerUp);
cv.addEventListener("touchstart", pointerDown, {passive:false});
cv.addEventListener("touchmove", pointerMove, {passive:false});
addEventListener("touchend", pointerUp);

/* ---------- audio (tiny WebAudio blips) ---------- */
let AC = null;
function beep(freq, dur, type, vol){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||"square"; o.frequency.value = freq;
    g.gain.value = vol||0.06;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur||0.12));
    o.stop(AC.currentTime + (dur||0.12));
  }catch(e){}
}
const sGood = ()=>{ beep(660,0.08,"square",0.05); setTimeout(()=>beep(990,0.1,"square",0.05),60); };
const sHit  = ()=>{ beep(150,0.25,"sawtooth",0.08); };
const sOver = ()=>{ beep(330,0.15,"square",0.06); setTimeout(()=>beep(220,0.2,"square",0.06),120); setTimeout(()=>beep(140,0.3,"square",0.06),260); };

/* ---------- spawning ---------- */
function spawnCreature(){
  const bad = Math.random() < Math.min(0.35 + elapsed*0.004, 0.6);
  const def = bad ? BAD[(Math.random()*BAD.length)|0] : GOOD[(Math.random()*GOOD.length)|0];
  const spr = def.spr;
  const h = spr.h*SCALE;
  const y = 8 + Math.random()*(H - h - 24);
  entities.push({
    spr, bad, score: def.score||0,
    x: W + 8, y,
    w: spr.w*SCALE, h,
    vx: -(speed + Math.random()*30),
    baseY: y, phase: Math.random()*Math.PI*2,
    amp: bad ? 6+Math.random()*10 : 4+Math.random()*6,
    dead:false
  });
}
function initDecor(){
  bubbles = [];
  for(let i=0;i<28;i++) bubbles.push({
    x:Math.random()*W, y:Math.random()*H,
    r:1+Math.random()*2, v:8+Math.random()*22
  });
  weeds = [];
  for(let i=0;i<7;i++) weeds.push({ x: 10+i*46+Math.random()*20, s:1+(Math.random()*1.5|0), sway:Math.random()*Math.PI*2 });
}

/* ---------- lifecycle ---------- */
function startGame(){
  state="play"; score=0; lives=3; speed=60; elapsed=0; spawnT=0; shake=0;
  entities=[]; player.x=40; player.y=H/2; player.hurt=0;
  initDecor();
}
function gameOver(){
  state="over"; sOver();
  if(score>best){ best=score; localStorage.setItem("bitClaudeOceanBest", best); }
}

/* ---------- collision ---------- */
function hit(a,b){
  // shrink hitboxes a touch for fairness
  const pad=4;
  return a.x+pad < b.x+b.w-pad && a.x+a.w-pad > b.x+pad &&
         a.y+pad < b.y+b.h-pad && a.y+a.h-pad > b.y+pad;
}

/* ---------- update ---------- */
let last = performance.now();
function update(dt){
  // ambient bubbles always rise
  for(const b of bubbles){ b.y -= b.v*dt; if(b.y < -4){ b.y = H+4; b.x = Math.random()*W; } }

  if(state!=="play"){ return; }

  elapsed += dt;
  speed = 60 + elapsed*4;          // gradually faster
  shake = Math.max(0, shake - dt*40);

  // ---- player movement ----
  const accel = 520, max = 150, fric = 0.86;
  let ax=0, ay=0;
  if(keys["arrowleft"]||keys["a"]) ax-=1;
  if(keys["arrowright"]||keys["d"]) ax+=1;
  if(keys["arrowup"]||keys["w"]) ay-=1;
  if(keys["arrowdown"]||keys["s"]) ay+=1;
  if(drag){
    const cx=player.x+player.w/2, cy=player.y+player.h/2;
    ax += Math.max(-1,Math.min(1,(drag.x-cx)/20));
    ay += Math.max(-1,Math.min(1,(drag.y-cy)/20));
  }
  player.vx = (player.vx + ax*accel*dt)*fric;
  player.vy = (player.vy + ay*accel*dt)*fric;
  player.vx = Math.max(-max,Math.min(max,player.vx));
  player.vy = Math.max(-max,Math.min(max,player.vy));
  if(Math.abs(player.vx)>5) player.flip = player.vx<0;
  player.x += player.vx*dt; player.y += player.vy*dt;
  player.x = Math.max(2, Math.min(W-player.w-2, player.x));
  player.y = Math.max(2, Math.min(H-player.h-2, player.y));
  player.bobT += dt; player.hurt = Math.max(0, player.hurt-dt);

  // ---- spawn ----
  spawnT -= dt;
  if(spawnT<=0){ spawnCreature(); spawnT = Math.max(0.45, 1.1 - elapsed*0.02); }

  // ---- creatures ----
  for(const e of entities){
    e.x += e.vx*dt;
    e.y = e.baseY + Math.sin(player.bobT*2 + e.phase)*e.amp;
    if(e.x + e.w < -8) e.dead = true;
    if(!e.dead && player.hurt<=0 && hit(player,e)){
      if(e.bad){
        lives--; player.hurt=1.0; shake=6; sHit();
        e.dead=true;
        if(lives<=0){ gameOver(); }
      }else{
        score += e.score; sGood(); e.dead=true;
        // sparkle bubbles on pickup
        for(let i=0;i<6;i++) bubbles.push({x:e.x+e.w/2, y:e.y+e.h/2, r:1+Math.random()*2, v:30+Math.random()*30});
        if(bubbles.length>60) bubbles.splice(0, bubbles.length-60);
      }
    }
  }
  entities = entities.filter(e=>!e.dead);
}

/* ---------- render ---------- */
function drawBG(t){
  // water gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1b6ea0"); g.addColorStop(0.5,"#0e5077"); g.addColorStop(1,"#072a40");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // light rays
  ctx.save(); ctx.globalAlpha=0.07; ctx.fillStyle="#bff4ff";
  for(let i=0;i<5;i++){
    const x = ((t*8 + i*70) % (W+60)) - 30;
    ctx.beginPath();
    ctx.moveTo(x,0); ctx.lineTo(x+24,0); ctx.lineTo(x-30,H); ctx.lineTo(x-54,H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // ambient bubbles
  ctx.fillStyle="rgba(200,245,255,0.4)";
  for(const b of bubbles){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
  // sandy floor
  ctx.fillStyle="#15324a"; ctx.fillRect(0,H-10,W,10);
  ctx.fillStyle="#c9a06a"; ctx.fillRect(0,H-6,W,6);
  ctx.fillStyle="#b08a55";
  for(let x=0;x<W;x+=6) ctx.fillRect(x+((x*7)%3),H-6,2,2);
  // seaweed
  for(const wd of weeds){
    const sway = Math.sin(t*1.5 + wd.sway)*1.4;
    drawSprite(seaweed, wd.x+sway, H-6-seaweed.h*wd.s, wd.s, false);
  }
}

function drawHUD(){
  ctx.fillStyle="#dff6ff"; ctx.font="10px 'Courier New',monospace"; ctx.textAlign="left";
  ctx.fillText("SCORE "+score, 6, 12);
  ctx.textAlign="right";
  ctx.fillText("BEST "+best, W-6, 12);
  // lives as little hearts
  ctx.textAlign="left";
  for(let i=0;i<3;i++){
    ctx.fillStyle = i<lives ? "#ff5d7a" : "#3a5a6a";
    ctx.fillText("♥", 6+i*12, 26);
  }
}

function centerText(lines, t){
  ctx.textAlign="center";
  let y = H/2 - (lines.length*9);
  for(const ln of lines){
    ctx.font = ln.big ? "bold 18px 'Courier New',monospace" : "11px 'Courier New',monospace";
    ctx.fillStyle = ln.c || "#dff6ff";
    const dy = ln.big ? Math.sin(t*3)*1.5 : 0;
    ctx.fillText(ln.s, W/2, y+dy);
    y += ln.big ? 22 : 14;
  }
}

function render(t){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBG(t);

  // creatures
  for(const e of entities){
    if(e.bad){ ctx.save(); ctx.globalAlpha = 0.85+0.15*Math.sin(t*8+e.phase); }
    drawSprite(e.spr, Math.round(e.x), Math.round(e.y), SCALE, e.vx>0);
    if(e.bad) ctx.restore();
  }

  // player (blink when hurt, bob gently)
  const bob = Math.sin(player.bobT*4)*1.2;
  const blink = player.hurt>0 && (Math.floor(player.hurt*12)%2===0);
  if(state==="play" || state==="over"){
    if(!blink) drawSprite(claude, Math.round(player.x), Math.round(player.y+bob), SCALE, player.flip);
  }

  drawHUD();

  if(state==="title"){
    // preview claude bobbing on title
    drawSprite(claude, W/2-claude.w*SCALE/2, H/2-44+Math.sin(t*2)*3, SCALE, false);
    centerText([
      {s:"BIT CLAUDE'S OCEAN DIVE", big:true, c:"#6ff0ff"},
      {s:"Collect 🐠 fish · ⭐ starfish · 🐚 shells", c:"#cfeeff"},
      {s:"Dodge 🪼 jellyfish · 🐡 puffers · 🦀 crabs · 🦑 squid", c:"#ffd0d0"},
      {s:"▶  Press SPACE / tap to dive in", c:"#8af1ec"},
    ], t);
  } else if(state==="over"){
    ctx.fillStyle="rgba(4,20,32,0.55)"; ctx.fillRect(0,0,W,H);
    centerText([
      {s:"GAME OVER", big:true, c:"#ff6f8a"},
      {s:"You scored "+score+(score>=best?"  ★ NEW BEST!":"  (best "+best+")"), c:"#ffe8a0"},
      {s:"▶  Press SPACE / tap to dive again", c:"#8af1ec"},
    ], t);
  }
  ctx.restore();
}

/* ---------- main loop ---------- */
function frame(now){
  let dt = (now-last)/1000; last=now;
  if(dt>0.05) dt=0.05; // clamp after tab switches
  update(dt);
  render(now/1000);
  requestAnimationFrame(frame);
}
initDecor();
requestAnimationFrame(frame);
</script>
</body>
</html>
